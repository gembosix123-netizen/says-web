<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title>SAYS Malaysia Clone social card</title>
  <desc>Gradient background with the SAYS tagline</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="40" fill="url(#bg)"/>
  <text x="120" y="280" fill="#ffffff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="bold">
    SAYS Malaysia Clone
  </text>
  <text x="120" y="360" fill="#dbeafe" font-family="'Inter', 'Segoe UI', sans-serif" font-size="40">
    Stories that spark the nation
  </text>
</svg>
